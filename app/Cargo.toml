[package]
name = "wasm-in-wasm"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wasm-in-wasm-bin"
path = "src/main.rs"


[dependencies]
eframe = { version = "0.35", features = ["glow"] } # you can see the default features here: https://github.com/emilk/egui/blob/master/crates/eframe/Cargo.toml#L34
egui = "0.35"
egui_extras = "0.35"
env_logger = "0.11.8"
log = "0.4.27"
wasm_component_layer = "0.1.18"
wasm_runtime_layer = "0.6"
wasmi_runtime_layer = "1.0"
semver = "1.0.26"
wit-bindgen = "0.59"
rfd = "0.17"
wit-parser = "0.253"
wit-component = "0.253"

wit-derive = { path = "../wit-derive" }
anyhow = "1.0.98"
wasmprinter = "0.253"

[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
web-sys = { version = "0.3.77", features = [
    "ResponseInit",
    "DecompressionStream",
    "ReadableStream",
    "Response",
    "CompressionFormat",
    "WritableStream",
    "ReadableWritablePair",
    "StreamPipeOptions",
    "ReadableStreamDefaultReader",
    "BlobPropertyBag",
    "Blob",
    "Performance",
    "Window"
  ] }

[patch.crates-io]
# expected `&[u8]`, found `Cursor<&[u8]>`
# https://github.com/DouglasDwyer/wasm_component_layer/issues/25
wasm_component_layer = { git = "https://github.com/juntyr/wasm_component_layer", branch = "resource-transfer-new" }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = "s"
#strip = true